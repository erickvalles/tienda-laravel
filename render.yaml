# Render.com Blueprint for the Laravel application (Docker runtime).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tienda-laravel
    runtime: docker
    dockerCommand: sh docker/start.sh
    plan: free
    healthCheckPath: /up
    autoDeploy: true
    preDeployCommand: php artisan migrate --force
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # Generate manually with: php artisan key:generate --show
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      # DATABASE_URL is linked automatically from the Postgres instance below
      - key: DATABASE_URL
        fromDatabase:
          name: tienda-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_LEVEL
        value: info

databases:
  - name: tienda-db
    databaseName: tienda
    user: tienda
    plan: free
    postgresMajorVersion: "17"
